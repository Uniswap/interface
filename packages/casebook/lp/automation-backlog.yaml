suggestedOrder: TxContext units → remove % parametrization → insufficient balance + review unit → native ETH Anvil → lifecycle Anvil → defer medium-priority chains / hooked / embedded.
notes:
  - LP Anvil e2e runs on `web/staging` push + weekday cron, not on every PR.
