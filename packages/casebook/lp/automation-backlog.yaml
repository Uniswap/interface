    recommendation: Manual / staging matrix
    notes: 11 chains
  - id: lp-add-remove-hooked-pool
    recommendation: Manual or special fixture
    notes: Hook pools
  - id: lp-lifecycle-full-round-trip
    recommendation: Anvil multi-step, release only
