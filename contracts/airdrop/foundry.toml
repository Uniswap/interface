# Foundry config for the HookSwap merkle-airdrop suite.
# Self-contained: no external dependencies (IERC20/SafeERC20/MerkleProof are all
# vendored under ./library). forge-std is used only by the deploy script.

[profile.default]
src = "."
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]

solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[fmt]
line_length = 100
tab_width = 2
