# Foundry config for the HookSwap referral router suite.
# Self-contained: no external dependencies (IERC20/Context/ReentrancyGuard/
# SafeERC20 are all vendored under ./library). Nothing to remap.

[profile.default]
src = "."
out = "out"
libs = []
remappings = []

solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[fmt]
line_length = 100
tab_width = 2
