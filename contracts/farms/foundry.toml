# Foundry config for the HookSwap staking-farms suite.
# Self-contained: IERC20/Context/ReentrancyGuard/SafeERC20/Ownable are all
# vendored under ./library (no external OpenZeppelin import). forge-std (for the
# deploy script only) is vendored under ./lib, mirroring the locker suite.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]

solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[fmt]
line_length = 100
tab_width = 2
