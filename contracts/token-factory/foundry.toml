# Foundry config for the HookSwap token-factory kit.
#
# Self-contained: no external dependencies. The fixed-supply ERC-20 is written
# from scratch (like ../seed/src/MockERC20.sol) and the few access-control /
# scripting primitives it needs (Context/Ownable + a forge Script shim) are
# vendored under src/library and src/vendor. No lib/ checkout or submodule and
# no `forge install` of external OpenZeppelin — nothing to remap.

[profile.default]
src = "src"
out = "out"
script = "script"
libs = []
remappings = []

solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[fmt]
line_length = 100
tab_width = 2
