# Foundry config for the HookSwap multisender (Disperse) suite.
# Self-contained: IERC20 + SafeERC20 are vendored under ./library. The only
# external dependency is forge-std (for the deploy script) — `forge install
# foundry-rs/forge-std` populates ./lib (gitignored). Mirrors the locker suite.

[profile.default]
src = "."
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]

solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[fmt]
line_length = 100
tab_width = 2
