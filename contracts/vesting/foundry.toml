# Foundry config for the HookSwap vesting suite.
# Self-contained: no external dependencies (IERC20/Context/Ownable/ReentrancyGuard
# are all vendored under ./library). Nothing to remap except forge-std for the
# deploy script.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]

solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[fmt]
line_length = 100
tab_width = 2
