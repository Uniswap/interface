<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HookSwap Docs</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<meta name="theme-color" content="#0B0F14" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="HookSwap" />
<meta property="og:title" content="HookSwap Docs" />
<meta property="og:description" content="Guides and reference for HookSwap — a multi-chain v2 + v3 DEX." />
<meta property="og:url" content="https://docs.hookswap.org" />
<meta property="og:image" content="/og-hookswap.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="/og-hookswap.png" />
<style>
  /* ---------------------------------------------------------------- fonts */
  @font-face{font-family:'Space Grotesk';font-weight:500;font-style:normal;font-display:swap;src:url('/fonts/SpaceGrotesk-Medium.woff2') format('woff2')}
  @font-face{font-family:'Space Grotesk';font-weight:600;font-style:normal;font-display:swap;src:url('/fonts/SpaceGrotesk-SemiBold.woff2') format('woff2')}
  @font-face{font-family:'Space Grotesk';font-weight:700;font-style:normal;font-display:swap;src:url('/fonts/SpaceGrotesk-Bold.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/IBMPlexSans-Regular.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-weight:600;font-style:normal;font-display:swap;src:url('/fonts/IBMPlexSans-SemiBold.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/IBMPlexMono-Regular.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-weight:600;font-style:normal;font-display:swap;src:url('/fonts/IBMPlexMono-SemiBold.woff2') format('woff2')}

  /* ------------------------------------------------------ signal palette */
  :root{
    --ink:#E7ECF2; --slate:#9AA4B2; --faint:#7C8698;
    --mist:#0B0F14; --panel:#0E141B; --line:#232B36; --line2:#1C232D; --white:#12181F;
    --green:#2FE07E; --green-deep:#2FE07E; --up:#2FE07E; --down:#EF4E4A;
    --green-bg:#0B2418; --green-border:#12502F; --btn-ink:#0B0F14;
    --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --display:'Space Grotesk',var(--sans);
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:var(--sans);font-size:15px;line-height:1.65;color:var(--ink);background:var(--mist);-webkit-font-smoothing:antialiased}
  a{color:var(--green-deep);text-decoration:none}
  a:hover{text-decoration:underline}

  /* -------------------------------------------------------------- header */
  header{display:flex;align-items:center;gap:12px;padding:13px 22px;border-bottom:1px solid var(--line);background:var(--white);position:sticky;top:0;z-index:10}
  header .logo-link{display:flex;align-items:center;gap:9px;text-decoration:none}
  header .logo-link svg{flex-shrink:0}
  header .wordmark{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--ink)}
  header .wordmark span{color:var(--green)}
  header .tab{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);border:1px solid var(--line);border-radius:999px;padding:3px 9px;line-height:1}
  header .right{margin-left:auto;display:flex;align-items:center;gap:14px}
  header .right a{font-size:13.5px;font-weight:600;color:var(--ink)}
  header .right a:hover{color:var(--green-deep);text-decoration:none}

  /* ---------------------------------------------------------------- layout */
  .wrap{display:flex;max-width:1200px;margin:0 auto;min-height:calc(100vh - 51px)}
  nav{width:240px;flex-shrink:0;padding:22px 14px;border-right:1px solid var(--line);position:sticky;top:51px;align-self:flex-start;max-height:calc(100vh - 51px);overflow-y:auto}
  nav .sec{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:18px 8px 8px}
  nav .sec svg{width:14px;height:14px;color:var(--green-deep);flex-shrink:0}
  nav a{display:block;padding:7px 10px;border-radius:10px;color:var(--ink);font-size:14px}
  nav a:hover{background:var(--mist);text-decoration:none}
  nav a.active{background:var(--green-bg);color:var(--green-deep);font-weight:600;box-shadow:inset 2px 0 0 var(--green)}
  main{flex:1;min-width:0;padding:30px 44px 90px;overflow-x:auto}
  .doc{max-width:820px}

  /* ------------------------------------------------------------ typography */
  main h1{font-family:var(--display);font-weight:600;font-size:32px;letter-spacing:-.02em;margin:0 0 10px;line-height:1.15}
  main h2,main h3,main h4{font-family:var(--display);letter-spacing:-.02em;scroll-margin-top:70px;line-height:1.2}
  main h2{font-weight:600;font-size:23px;margin:38px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  main h3{font-weight:600;font-size:18px;margin:26px 0 8px}
  main h4{font-weight:600;font-size:15px;margin:20px 0 6px}
  main p,main li{color:var(--ink)}
  main strong{font-weight:600}
  main h2 .anchor,main h3 .anchor{opacity:0;margin-left:8px;font-size:.62em;color:var(--faint);transition:opacity .12s;font-family:var(--mono)}
  main h2:hover .anchor,main h3:hover .anchor{opacity:1}
  main blockquote{margin:14px 0;padding:10px 16px;border-left:3px solid var(--green);background:var(--green-bg);border-radius:0 10px 10px 0;color:var(--ink)}
  main blockquote p{margin:4px 0}
  main hr{border:none;border-top:1px solid var(--line);margin:28px 0}
  main img{max-width:100%}

  /* --------------------------------------------------------------- code */
  main pre{position:relative;background:#0E141B;color:#E6E9EE;padding:15px 16px;border-radius:12px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.55}
  main code{font-family:var(--mono);font-size:.88em;background:var(--panel);color:var(--ink);padding:2px 6px;border-radius:6px}
  main pre code{background:none;padding:0;color:inherit}
  main a code{color:var(--green-deep)}
  main pre .copy-btn{position:absolute;top:9px;right:9px;background:#161B22;color:#B0B7C0;border:1px solid #2A313B;border-radius:8px;padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--mono)}
  main pre .copy-btn:hover{background:#222932;color:#fff}
  main pre .copy-btn.ok{color:var(--green);border-color:var(--green-deep)}

  /* --------------------------------------------------------------- tables */
  main table{border-collapse:collapse;width:100%;margin:16px 0;font-size:13.5px}
  main th,main td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
  main th{background:var(--mist);font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.02em;color:var(--slate)}
  /* Addresses / hashes / numbers in markdown tables render as <code> → mono already */

  /* ---------------------------------------------------------------- hero */
  .hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;padding:30px 32px;margin:0 0 32px;background:linear-gradient(135deg,var(--green-bg),var(--white))}
  .hero-bg{position:absolute;top:-30px;right:-20px;width:260px;height:220px;opacity:.45;pointer-events:none}
  .hero-top{display:flex;align-items:center;gap:16px;position:relative}
  .hero-logo{width:50px;height:50px;flex-shrink:0}
  .hero h1{font-family:var(--display);font-weight:600;font-size:29px;letter-spacing:-.02em;margin:0}
  .hero h1 .s{color:var(--green-deep)}
  .hero .tag{color:var(--slate);margin:5px 0 0;font-size:14.5px;max-width:640px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px;position:relative}
  .stat{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
  .stat .v{font-family:var(--mono);font-weight:600;font-size:19px;color:var(--green-deep);line-height:1.1}
  .stat .k{font-size:12px;color:var(--slate);margin-top:6px}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;position:relative}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:12px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--white);color:var(--ink);cursor:pointer}
  .btn:hover{border-color:var(--green);text-decoration:none}
  .btn svg{width:15px;height:15px}
  .btn.primary{background:var(--green);color:var(--btn-ink);border-color:var(--green)}
  .btn.primary:hover{background:#25c96e;border-color:#25c96e}

  /* -------------------------------------------------------- contracts page */
  .cx-lead{color:var(--slate);font-size:15px;max-width:760px;margin:0 0 20px}
  .cx-common{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:0 0 30px}
  .cx-common .box{border:1px solid var(--line);border-radius:14px;background:var(--white);padding:13px 15px}
  .cx-common .box .k{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--slate)}
  .cx-common .box .v{font-family:var(--mono);font-size:12.5px;margin-top:5px;word-break:break-all;color:var(--ink)}
  .cx-chain{border:1px solid var(--line);border-radius:14px;background:var(--white);margin:0 0 16px;overflow:hidden}
  .cx-chain>.hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line2);background:var(--mist)}
  .cx-chain>.hd .nm{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:-.02em}
  .cx-chain>.hd .id{font-family:var(--mono);font-size:12px;color:var(--slate)}
  .cx-chain>.hd .id b{color:var(--ink);font-weight:600}
  .cx-chain>.hd .tag{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--green-deep);background:var(--green-bg);border:1px solid var(--green-border);border-radius:999px;padding:3px 10px}
  .cx-tbl{width:100%;border-collapse:collapse}
  .cx-tbl td{border-top:1px solid var(--line2);padding:8px 18px;font-size:13.5px}
  .cx-tbl tr:first-child td{border-top:none}
  .cx-tbl td.k{width:230px;color:var(--slate);white-space:nowrap}
  .cx-tbl td.v{font-family:var(--mono);font-size:12.5px;color:var(--ink);word-break:break-all}
  .cx-addr{font-family:var(--mono);color:var(--ink);text-decoration:none;border-bottom:1px solid transparent}
  .cx-addr:hover{color:var(--green-deep);text-decoration:none;border-bottom-color:var(--green-border)}
  .cx-common .box .v .cx-addr{font-size:12.5px}
  .cx-note{font-size:12.5px;color:var(--slate);padding:10px 18px;border-top:1px solid var(--line2);background:var(--mist)}
  @media(max-width:800px){
    nav{display:none}main{padding:22px 18px 70px}
    .stats{grid-template-columns:repeat(2,1fr)}.hero{padding:22px}
    .cx-tbl td.k{width:auto;white-space:normal}
  }
</style>
</head>

const SEC_ICONS = {

const nav = document.getElementById('nav');
const content = document.getElementById('content');
// Whitelist of loadable routes (from TREE) — prevents path traversal / arbitrary
// same-origin fetch driven by location.hash. Only these exact paths ever load.
const ALLOWED = new Set();
for (const [sec, items] of TREE){
  const h = document.createElement('div'); h.className='sec';
  const ico = document.createElement('span'); ico.innerHTML = SEC_ICONS[sec] || ''; // trusted static markup
  const lbl = document.createElement('span'); lbl.textContent = sec;
  if (ico.firstChild) h.appendChild(ico.firstChild);
  h.appendChild(lbl); nav.appendChild(h);
  for (const [label, path] of items){
    ALLOWED.add(path);
    const a = document.createElement('a'); a.textContent=label; a.href='#'+path; a.dataset.path=path; nav.appendChild(a);
  }
}
function setText(el, s){ el.textContent = s; }

// Static home hero (trusted markup only — no user/hash input interpolated).

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function contractsHTML(){
  let h = '<h1 id="contracts">Contract addresses</h1>';
  h += '<p class="cx-lead">HookSwap runs its <b>own</b> full v2 + v3 + Universal Router stack, plus token lockers and a referral router, on every chain. All values below are copied verbatim from the on-chain deployment records (<code>contracts/deployments/*.json</code>). Every address is public.</p>';
  h += '<div class="cx-common">'+
    '<div class="box"><div class="k">Permit2 (canonical, every chain)</div><div class="v">'+addrLink(CX_COMMON.permit2Explorer, CX_COMMON.permit2)+'</div></div>'+
    '<div class="box"><div class="k">v2 pair init-code hash</div><div class="v">'+esc(CX_COMMON.v2Hash)+'</div></div>'+
    '<div class="box"><div class="k">v3 pool init-code hash</div><div class="v">'+esc(CX_COMMON.v3Hash)+'</div></div>'+
  '</div>';
  for (const c of CX_CHAINS){
    const exp = CX_EXPLORER[c.id];
    h += '<div class="cx-chain">';
    h += '<div class="hd"><span class="nm">'+esc(c.nm)+'</span><span class="id">chain id <b>'+esc(c.id)+'</b></span><span class="tag">'+esc(c.tag)+'</span></div>';
    h += '<table class="cx-tbl"><tbody>';
    for (const [key,label] of CX_ROWS){
      const v = c.a[key];
      if (!v) continue; // omit rows absent from this chain's JSON
      h += '<tr><td class="k">'+esc(label)+'</td><td class="v">'+(exp?addrLink(exp,v):esc(v))+'</td></tr>';
    }
    h += '</tbody></table>';
    if (c.note) h += '<div class="cx-note">'+esc(c.note)+'</div>';
    h += '</div>';
  }
  h += '<p class="cx-lead" style="margin-top:22px">Looking for the deterministic-group breakdown, canonical Sepolia stack, and v3 fee-tier reference? See <a href="#developers/contract-addresses.md">Developers → Contract addresses</a>.</p>';
  return h;
}

function enhance(path){
  // copy buttons on code blocks
  content.querySelectorAll('pre').forEach(pre=>{
    if(pre.querySelector('.copy-btn')) return;
    const b=document.createElement('button'); b.type='button'; b.className='copy-btn'; b.textContent='Copy';
    b.addEventListener('click',()=>{
      const code=pre.querySelector('code'); const text=code?code.textContent:pre.textContent;
      navigator.clipboard.writeText(text).then(()=>{
        b.textContent='Copied'; b.classList.add('ok');
        setTimeout(()=>{ b.textContent='Copy'; b.classList.remove('ok'); },1400);
      }).catch(()=>{ b.textContent='Failed'; setTimeout(()=>{ b.textContent='Copy'; },1400); });
    });
    pre.appendChild(b);
  });
  // anchor links on headings (deep-link via "<docpath>::<headingId>", still whitelisted on load)
  content.querySelectorAll('h2[id],h3[id]').forEach(h=>{
    if(h.querySelector('.anchor')) return;
    const a=document.createElement('a'); a.className='anchor'; a.textContent='#'; a.title='Link to this section';
    a.href='#'+path+'::'+h.id;
    h.appendChild(a);
  });
}
function scrollToFrag(frag){
  const el=document.getElementById(frag); // id lookup is injection-safe
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  else window.scrollTo(0,0);
}
let currentPath=null;
async function load(path, frag){
  if(!ALLOWED.has(path)){
    content.innerHTML = '<div class="doc"></div>';
    const h=document.createElement('h1'); setText(h,'Not found'); content.firstChild.appendChild(h);
    return;
  }
  // Synthetic, self-contained Contracts page (no markdown fetch; trusted static markup).
  if(path==='contracts'){
    content.innerHTML = '<div class="doc">'+contractsHTML()+'</div>';
    document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active', a.dataset.path===path));
    currentPath=path; window.scrollTo(0,0);
    return;
  }
  try{
    const res = await fetch('/md/' + encodeURI(path));
    if(!res.ok) throw new Error(res.status);
    const md = await res.text();
    // Our own trusted docs only (whitelisted). marked renders to sanitized-ish HTML;
    // raw inline HTML in the markdown is escaped by disabling the html tokenizer.
    const doc = document.createElement('div'); doc.className='doc';
    doc.innerHTML = marked.parse(md, { mangle:false, headerIds:true });
    content.innerHTML=''; content.appendChild(doc);
    if(path==='README.md'){
      const hero=document.createElement('div'); hero.innerHTML=heroHTML(); // trusted static markup
      doc.insertBefore(hero.firstChild, doc.firstChild);
    }
  }catch(e){
    content.innerHTML = '<div class="doc"></div>';
    const h=document.createElement('h1'); setText(h,'Not found');
    const p=document.createElement('p'); setText(p,'Could not load this page.');
    content.firstChild.appendChild(h); content.firstChild.appendChild(p);
  }
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active', a.dataset.path===path));
  currentPath=path;
  enhance(path);
  if(frag) scrollToFrag(frag); else window.scrollTo(0,0);
}
function route(){
  const raw = location.hash.slice(1);
  const i = raw.indexOf('::');
  const p = i>=0 ? raw.slice(0,i) : raw;
  const frag = i>=0 ? raw.slice(i+2) : null;
  const path = ALLOWED.has(p) ? p : 'README.md';
  if(path===currentPath){ if(frag) scrollToFrag(frag); else window.scrollTo(0,0); return; }
  load(path, frag);
}
window.addEventListener('hashchange', route);
route();
