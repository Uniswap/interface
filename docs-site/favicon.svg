<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- HookSwap favicon: pointy-top hexagon (ink) + open green "hook" ring.
       Geometry ported from apps/web/src/terminal/components/HookLogo.tsx.
       Paper rounded-square backing keeps the ink hexagon visible on both
       light and dark browser chrome. -->
