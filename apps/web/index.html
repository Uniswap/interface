<!DOCTYPE html>
<html translate="no">
  <head>
    <meta charset="utf-8" />

    <title>HookSwap Interface</title>

    <!-- Vite uses / for public assets instead of %PUBLIC_URL% -->
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/images/192x192_App_Icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/images/512x512_App_Icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#fff" />
    <meta name="format-detection" content="telephone=no">

    <!-- CSP will be injected here -->

    <link rel="preconnect" href="https://interface.gateway.uniswap.org/" crossorigin/>
    <link rel="preconnect" href="https://mainnet.infura.io/" crossorigin/>

    <link rel="preload" href="/fonts/Inter-normal.var.ttf" as="font" type="font/ttf" crossorigin />
    
    <!-- Cloudflare Turnstile script - loaded early for CSP compliance -->
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin />
    <script id="cf-turnstile-script" src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>

    <style>
      * {
        font-family: 'Inter', sans-serif;
        box-sizing: border-box;
      }

      /* Monospace stack. JetBrains Mono is not bundled, so this resolves via the
         native ui-monospace/monospace fallback without referencing a missing file. */
      code,
      pre,
      kbd,
      samp {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }

      /* HookSwap brand type: full Inter variable font (all weights 100-900) from public/.
         Replaces the old Basel Grotesk (font files no longer shipped). */
      @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
        src: url('/fonts/Inter-normal.var.ttf') format('truetype-variations');
      }

      /* Subsetted Inter Regular (Latin) — fast first paint for common glyphs. */
      @font-face {
        font-family: 'Inter';
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0020-007E, U+00A0-024F, U+1E00-1EFF;
        src: url('/fonts/Inter-Regular-Latin.woff2') format('woff2');
      }

      @supports (font-variation-settings: normal) {
        * {
          font-family: 'Inter', sans-serif;
        }
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      /* Only apply overflow-x: hidden on desktop */
      @media (min-width: 768px) {
        html {
          overflow-x: hidden;
        }
      }

      button {
        user-select: none;
      }

      html {
        font-size: 16px;
        font-weight: 485;
        font-variant: none;
        font-smooth: always;
        text-rendering: optimizeLegibility !important;
        -webkit-font-smoothing: antialiased !important;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      }

      html,
      body,
      #root {
        min-height: 100%;
      }

      @media (prefers-color-scheme: dark) {
        html {
          background: linear-gradient(rgb(19, 19, 19) 0%, rgb(19, 19, 19) 100%);
        }
      }

      @media (prefers-color-scheme: light) {
        html {
          background: radial-gradient(100% 100% at 50% 0%, rgba(255, 184, 226, 0) 0%, rgba(255, 255, 255, 0) 100%), rgb(255, 255, 255);
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>
    <div id="background-radial-gradient"></div>

    <script type="module" src="/zone-events.js"></script>
    <!-- Vite entry point -->
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
