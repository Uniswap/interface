appId: com.uniswap.mobile.dev
jsEngine: graaljs
tags:
  - performance-tracking
  - language-agnostic
env:
  E2E_RECOVERY_PHRASE: ${E2E_RECOVERY_PHRASE}
  DATADOG_API_KEY: ${DATADOG_API_KEY}
  PLATFORM: ${PLATFORM}
  GITHUB_REF_NAME: ${GITHUB_REF_NAME}
  GITHUB_SHA: ${GITHUB_SHA}
  GITHUB_RUN_ID: ${GITHUB_RUN_ID}
---
# Initialize tracking at the very beginning
- runScript:
    file: ../../scripts/performance/dist/actions/init-tracking.js
    env:
      PLATFORM: ${PLATFORM}

# Start flow tracking (includes setup time)
- runScript:
    file: ../../scripts/performance/dist/actions/start-flow.js
    env:
      FLOW_NAME: 'swap'

# Run prerequisite flows (tracked as sub-flows)
- runFlow: ../../shared-flows/start.yaml
- runFlow: ../../shared-flows/recover-fast.yaml

# Wait for home screen to be ready; without it, tapping Swap succeeds but the modal doesn't actually appear. Maybe there's a better way?
- extendedWaitUntil:
    visible: 'noop'
    timeout: 2000
    optional: true

# Start of swap flow with action tracking
- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'Swap'
      PHASE: 'start'
- tapOn:
    id: ${output.testIds.Swap}
- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'Swap'
      PHASE: 'end'

- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'ChooseOutputToken'
      PHASE: 'start'
- tapOn:
    id: ${output.testIds.ChooseOutputToken}
- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'ChooseOutputToken'
      PHASE: 'end'

- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'ExploreSearchInput'
      PHASE: 'start'
- tapOn:
    id: ${output.testIds.ExploreSearchInput}
- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'ExploreSearchInput'
      PHASE: 'end'

- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'inputText'
      TARGET: 'cbbtc'
      PHASE: 'start'
# The trailing chain name scopes the search to Base; an unscoped "cbbtc" lists
# cbBTC on every chain and the Base row can land below the fold.
- inputText: cbbtc base
- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'inputText'
      TARGET: 'cbbtc'
      PHASE: 'end'

- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'token-option-8453-cbBTC'
      PHASE: 'start'
- extendedWaitUntil:
    visible:
      id: 'token-option-8453-cbBTC'
    timeout: 10000
- tapOn:
    id: 'token-option-8453-cbBTC'
- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'token-option-8453-cbBTC'
      PHASE: 'end'

# The selector keeps the sell token on mainnet, which makes the pair cross-chain: exact output is
# unavailable for a cross-chain pair (getExactOutputWillFail) and the e2e wallet funds swaps on
# Base, so pick ETH on Base as the sell token too
- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'ChooseInputToken'
      PHASE: 'start'
- tapOn:
    id: ${output.testIds.ChooseInputToken}
- tapOn:
    id: ${output.testIds.ExploreSearchInput}
- inputText: eth base
- extendedWaitUntil:
    visible:
      id: 'token-option-8453-ETH'
    timeout: 10000
- tapOn:
    id: 'token-option-8453-ETH'
- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'ChooseInputToken'
      PHASE: 'end'

# Amount input tracking
- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'AmountInputOut'
      PHASE: 'start'
- tapOn:
    id: ${output.testIds.AmountInputOut}
- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'AmountInputOut'
      PHASE: 'end'

# Number pad input tracking (consolidated for brevity)
- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'inputAmount'
      TARGET: '0.000001'
      PHASE: 'start'
- tapOn:
    id: ${output.testIds.DecimalPadNumber0}
- tapOn:
    id: ${output.testIds.DecimalPadDecimal}
- tapOn:
    id: ${output.testIds.DecimalPadNumber0}
- tapOn:
    id: ${output.testIds.DecimalPadNumber0}
- tapOn:
    id: ${output.testIds.DecimalPadNumber0}
- tapOn:
    id: ${output.testIds.DecimalPadNumber0}
- tapOn:
    id: ${output.testIds.DecimalPadNumber0}
- tapOn:
    id: ${output.testIds.DecimalPadNumber1}
- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'inputAmount'
      TARGET: '0.000001'
      PHASE: 'end'

# Wait for the ReviewSwap button to be visible; without this, e2e test sometimes registers a success but the button is not actually tapped.
- extendedWaitUntil:
    visible: 'noop'
    timeout: 2000
    optional: true

# Review swap tracking
- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'ReviewSwap'
      PHASE: 'start'
- tapOn:
    id: ${output.testIds.ReviewSwap}
- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'ReviewSwap'
      PHASE: 'end'

# When the quoted sell amount is most of the wallet's ETH on Base, Review first shows the
# low-network-token-balance sheet; its Continue button (the only element with the confirm
# testID here) proceeds to the review screen. Matched by id, not copy: the
# language-agnostic batch runs in pt_BR.
- extendedWaitUntil:
    visible:
      id: ${output.testIds.Confirm}
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: ${output.testIds.Confirm}
    commands:
      - tapOn:
          id: ${output.testIds.Confirm}

- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'ListSeparatorToggle'
      PHASE: 'start'
# The review screen shows its details once the quote and simulation are in
- extendedWaitUntil:
    visible:
      id: ${output.testIds.ListSeparatorToggle}
    timeout: 30000
- tapOn:
    id: ${output.testIds.ListSeparatorToggle}
- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'ListSeparatorToggle'
      PHASE: 'end'

# Execute swap tracking
- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'ConfirmSwap'
      PHASE: 'start'
- tapOn:
    id: ${output.testIds.Swap}
- runScript:
    file: ../../scripts/performance/dist/actions/track-action.js
    env:
      ACTION: 'tapOn'
      TARGET: 'ConfirmSwap'
      PHASE: 'end'

# End flow tracking
- runScript:
    file: ../../scripts/performance/dist/actions/end-flow.js

# Upload metrics to Datadog (for Maestro Cloud)
- runScript:
    file: ../../scripts/performance/upload-metrics.js
    env:
      DATADOG_API_KEY: ${DATADOG_API_KEY}
      GITHUB_REF_NAME: ${GITHUB_REF_NAME}
      GITHUB_SHA: ${GITHUB_SHA}
      GITHUB_RUN_ID: ${GITHUB_RUN_ID}
      ENVIRONMENT: 'maestro_cloud'
